{{- if not (.Store.Get "mermaid") -}}
  {{- .Store.Set "mermaid" true -}}
  {{- $mermaid := resources.Get "mermaid.js" | resources.Minify | resources.Fingerprint -}}
  {{- $config := resources.Get "mermaid.json" | resources.Minify -}}
  <script defer src="{{ "mermaid.min.js" | relURL }}"></script>
  <script defer src="{{ $mermaid.RelPermalink }}" {{ template "integrity" $mermaid }} data-config="{{ $config.Content }}"></script>
{{- end -}}
